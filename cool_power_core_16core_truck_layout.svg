  <text x="40" y="100" class="sec-hdr">1. EXHAUST TAP &amp; SCRUB</text>

  <!-- Main Class 8 Exhaust Stack -->
  <rect x="44" y="115" width="44" height="395" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="4"/>
  <text x="66" y="310" class="lbl" text-anchor="middle" transform="rotate(-90 66 310)">CLASS 8 EXHAUST (380°C | 185 kW THERMAL)</text>

  <!-- Slipstream Tap Valve (6.1% flow) -->
