  <text x="176" y="480" class="sublbl" text-anchor="middle">8.64 L/hr Feed Rate</text>
  <text x="176" y="492" class="sublbl" text-anchor="middle">(16 x 0.54 L/hr)</text>

  <!-- ZONE 2: 16-CORE INTERLEAVED ARRAY MATRIX (CENTER) -->
