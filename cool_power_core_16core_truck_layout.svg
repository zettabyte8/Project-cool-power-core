  <text x="176" y="270" class="sublbl" text-anchor="middle">&lt;1.0 µm Cut-off</text>
  <text x="176" y="282" class="sublbl" text-anchor="middle">(5 µm Bearing Guard)</text>

  <!-- Fluidic Vortex Amplifier Splitter -->
