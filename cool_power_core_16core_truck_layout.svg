  <text x="965" y="164" class="sublbl" text-anchor="middle">Inlet: 18.4 ppm O₃ → Outlet: &lt;0.04 ppm</text>
  <text x="965" y="177" class="sublbl" text-anchor="middle">28 W Shared PTC Dew-Point Trim</text>
  <text x="965" y="190" class="sublbl" text-anchor="middle">Backpressure Drop: 34 Pa</text>

