      .subtitle { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .sec-hdr { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #1e293b; letter-spacing: 0.5px; }
      .lbl { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #0f172a; }
      .sublbl { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 8.5px; fill: #334155; }
      .pipe-hot { stroke: #dc2626; stroke-width: 4; fill: none; }
      .pipe-warm { stroke: #f97316; stroke-width: 3; fill: none; }
      .pipe-cool { stroke: #0284c7; stroke-width: 3; fill: none; }
      .pipe-water { stroke: #0ea5e9; stroke-width: 2.5; stroke-dasharray: 5,3; fill: none; }
      .bus-hv { stroke: #7c3aed; stroke-width: 3.5; fill: none; }
      .bus-can { stroke: #10b981; stroke-width: 2; stroke-dasharray: 4,2; fill: none; }
      .box-core { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; rx: 4; }
      .box-sub { fill: #ffffff; stroke: #64748b; stroke-width: 1.2; rx: 4; }
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-org" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f97316"/>
    </marker>
    <marker id="arr-blu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
