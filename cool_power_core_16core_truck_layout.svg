  <rect x="12" y="12" width="1096" height="656" fill="none" stroke="#cbd5e1" stroke-width="1.5" rx="6"/>

  <!-- Header Block -->
  <text x="28" y="38" class="title">COOL POWER CORE — 16-CORE CLASS 8 SEMI-TRUCK SLIPSTREAM RACK ARCHITECTURE</text>
  <text x="28" y="55" class="subtitle">CFG-08 Dual-Flywheel + 876 kHz PLL-Tracked Burst-Mode GaN-ZVS Air-Core Slayer Exciter | 22.5° Phase Interleaving | +11.44 kW Net Output</text>
  <line x1="28" y1="66" x2="1092" y2="66" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ZONE 1: CLASS 8 EXHAUST SLIPSTREAM & PRE-FILTRATION (LEFT) -->
