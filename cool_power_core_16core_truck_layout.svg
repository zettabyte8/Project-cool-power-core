  <rect x="124" y="330" width="104" height="72" class="box-sub"/>
  <text x="176" y="348" class="lbl" text-anchor="middle">Graphene Vortex</text>
  <text x="176" y="361" class="lbl" text-anchor="middle">Amplifier Splitter</text>
  <text x="176" y="374" class="sublbl" text-anchor="middle">No-Moving-Parts</text>
  <text x="176" y="386" class="sublbl" text-anchor="middle">Clamps N52H &lt;105°C</text>

