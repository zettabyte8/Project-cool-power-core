  <!-- Shared alpha-MnO2 Ozone Quench Manifold -->
  <rect x="854" y="120" width="222" height="86" class="box-sub"/>
  <text x="965" y="138" class="lbl" text-anchor="middle">Shared α-MnO₂ Quench Bed</text>
